name: Atualizar Repositórios

on:
  schedule:
    - cron: '0 0 * * *' # Roda todo dia à meia-noite
  workflow_dispatch: # Permite rodar manualmente no botão

jobs:
  atualizar-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Garante que o robô pode salvar o README

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Buscar repositórios e atualizar README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import urllib.request
          import json
          import re
          import os

          token = os.environ.get('GITHUB_TOKEN')
          url = "https://api.github.com/users/joaopedroguska/repos?type=owner&sort=updated&per_page=6"
          
          req = urllib.request.Request(url, headers={
              'User-Agent': 'Mozilla/5.0',
              'Authorization': f'token {token}'
          })
          
          with urllib.request.urlopen(req) as response:
              repos = json.loads(response.read().decode())

          markdown_list = "\n"
          for repo in repos:
              # Ignora o próprio repositório de perfil para não poluir a lista
              if repo['name'].lower() != "joaopedroguska":
                  name = repo['name']
                  url_repo = repo['html_url']
                  desc = repo.get('description') or 'Sem descrição.'
                  markdown_list += f"* **[{name}]({url_repo})**: {desc}\n"
          markdown_list += "\n"

          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()

          new_content = re.sub(
              r'(<!-- START_SECTION:repos -->).*?(<!-- END_SECTION:repos -->)',
              f'\\1{markdown_list}\\2',
              content,
              flags=re.DOTALL
          )

          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(new_content)
        shell: python

      - name: Salvar alterações no GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: atualiza portfólio dinamicamente" || echo "Sem mudanças"
          git push
