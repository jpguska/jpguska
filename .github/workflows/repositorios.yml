name: Atualizar Perfil Completo

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  atualizar-tudo:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # 1. Gera os SVGs PRIMEIRO (essas actions já commitam e pusham sozinhas)
      - name: Gerar Gráfico de Linguagens
        uses: lowlighter/metrics@latest
        with:
          filename: linguagens.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: jpguska
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: percentage

      - name: Gerar Estatísticas Gerais
        uses: lowlighter/metrics@latest
        with:
          filename: estatisticas.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: jpguska
          template: classic
          base: header, activity, community, repositories

      # 2. Sincroniza com o remoto (os passos acima já pushearam)
      - name: Sincronizar com o remoto
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      # 3. Atualiza o README via Python
      - name: Atualizar README via Python
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import urllib.request
          import urllib.parse
          import json
          import os

          token = os.environ.get('GITHUB_TOKEN')
          url = "https://api.github.com/users/jpguska/repos?type=owner&sort=updated&per_page=100"

          req = urllib.request.Request(url, headers={
              'User-Agent': 'Mozilla/5.0',
              'Authorization': f'token {token}'
          })

          with urllib.request.urlopen(req) as response:
              repos = json.loads(response.read().decode())

          # --- PARTE 1: PORTFÓLIO (Últimos 6) ---
          markdown_repos = "\n"
          recent_repos = [r for r in repos if r['name'].lower() != "jpguska"][:6]

          for repo in recent_repos:
              name = repo['name']
              url_repo = repo['html_url']
              desc = repo.get('description') or 'Sem descrição.'
              markdown_repos += f"* **[{name}]({url_repo})**: {desc}\n"
          markdown_repos += "\n"

          # --- PARTE 2: BADGES DE LINGUAGEM ---
          languages_found = set()
          for repo in repos:
              if repo['name'].lower() != "jpguska" and repo.get('language'):
                  languages_found.add(repo['language'])

          badge_map = {
              "Go": "![Go](https://img.shields.io/badge/Go-00ADD8?style=for-the-badge&logo=go&logoColor=white)",
              "Java": "![Java](https://img.shields.io/badge/Java-007396?style=for-the-badge&logo=openjdk&logoColor=white)",
              "C": "![C](https://img.shields.io/badge/C-A8B9CC?style=for-the-badge&logo=c&logoColor=black)",
              "C++": "![C++](https://img.shields.io/badge/C++-00599C?style=for-the-badge&logo=cplusplus&logoColor=white)",
              "C#": "![C#](https://img.shields.io/badge/C%23-239120?style=for-the-badge&logo=csharp&logoColor=white)",
              "Python": "![Python](https://img.shields.io/badge/Python-3776AB?style=for-the-badge&logo=python&logoColor=white)",
              "JavaScript": "![JavaScript](https://img.shields.io/badge/JavaScript-F7DF1E?style=for-the-badge&logo=javascript&logoColor=black)"
          }

          markdown_badges = "\n"
          for lang in sorted(languages_found):
              if lang in badge_map:
                  markdown_badges += badge_map[lang] + "\n"
              else:
                  safe_lang = urllib.parse.quote(lang)
                  markdown_badges += f"![{lang}](https://img.shields.io/badge/{safe_lang}-4D4D4D?style=for-the-badge)\n"
          markdown_badges += "\n"

          # --- PARTE 3: INJETAR NO README ---
          def replace_section(text, start_tag, end_tag, insertion):
              start_idx = text.find(start_tag)
              end_idx = text.find(end_tag)
              if start_idx != -1 and end_idx != -1:
                  return text[:start_idx + len(start_tag)] + insertion + text[end_idx:]
              return text

          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()

          content = replace_section(
              content,
              '<!-- START_SECTION:repos -->',
              '<!-- END_SECTION:repos -->',
              markdown_repos
          )
          content = replace_section(
              content,
              '<!-- START_SECTION:langs -->',
              '<!-- END_SECTION:langs -->',
              markdown_badges
          )

          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(content)
        shell: python

      # 4. Commit final do README (só commita se houver mudança)
      - name: Commit do README
        run: |
          git add README.md
          git diff --staged --quiet || git commit -m "docs: atualiza portfólio e badges dinamicamente"
          git push
