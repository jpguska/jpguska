name: Atualizar Perfil Automaticamente

on:
  schedule:
    # Executa automaticamente todos os dias à meia-noite (UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Permite que você rode o script manualmente a qualquer momento

jobs:
  update-profile:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Fazer checkout do repositório
        uses: actions/checkout@v4

      # 1. Gera a imagem das linguagens e salva localmente no repositório
      - name: Gerar Gráfico de Linguagens
        uses: lowlighter/metrics@latest
        with:
          filename: linguagens.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: joaopedroguska
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: percentage

      # 2. Configura o Python para o script de repositórios
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Script Python que busca os repositórios na API do GitHub e injeta no README
      - name: Atualizar Lista de Repositórios no README
        run: |
          import urllib.request
          import json
          import re

          url = "https://api.github.com/users/joaopedroguska/repos?type=owner&sort=updated&per_page=6"
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          
          with urllib.request.urlopen(req) as response:
              repos = json.loads(response.read().decode())

          markdown_list = ""
          for repo in repos:
              if repo['name'].lower() != "joaopedroguska": # Ignora o repositório do próprio perfil
                  name = repo['name']
                  url = repo['html_url']
                  desc = repo.get('description') or 'Sem descrição.'
                  lang = repo.get('language') or 'N/A'
                  markdown_list += f"* **[{name}]({url})**: {desc} *(Tecnologia: {lang})*\n"

          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()

          # Substitui o conteúdo entre as tags START_SECTION e END_SECTION
          new_content = re.sub(
              r'(<!-- START_SECTION:repos -->).*?(<!-- END_SECTION:repos -->)',
              f'\\1\n{markdown_list}\\2',
              content,
              flags=re.DOTALL
          )

          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(new_content)
        shell: python

      # 4. Salva (commita) o README modificado e o novo linguagens.svg
      - name: Commit e Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md linguagens.svg
          git commit -m "docs: atualização automática de repositórios e métricas" || echo "Nenhuma mudança para commitar"
          git push